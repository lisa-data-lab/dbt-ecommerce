version: 2

sources:
  - name: olist
    database: bronze_dev # Adjust if you are using a different Databricks catalog
    schema: olist
    tables:
      - name: customers
      - name: geolocation
      - name: order_items
      - name: order_payments
      - name: order_reviews
      - name: orders
      - name: products
      - name: sellers

models:
  - name: stg_customers_olist
    description: "Cleaned and standardized Olist customer profile records."

  - name: stg_geolocations_olist
    description: "Staging table for Olist geolocation data mapping zip code prefixes to spatial coordinates."
    columns:
      - name: zip_code_prefix
        description: "The first 5 digits of the zip code."
        tests:
          - not_null
      - name: latitude
        description: "Latitude coordinate."
        tests:
          - not_null
      - name: longitude
        description: "Longitude coordinate."
        tests:
          - not_null 

  - name: stg_order_items_olist
    description: "Staging table for order line item details, including pricing, freight, and fulfillment deadlines."
    columns:
      - name: order_id
        description: "The unique identifier of the order."
        tests:
          - not_null
      - name: line_item_number
        description: "The sequential number identifying the item within the order (e.g., 1, 2, 3)."
        tests:
          - not_null
      - name: product_id
        description: "The unique identifier of the product."
        tests:
          - not_null
      - name: seller_id
        description: "The unique identifier of the seller."
        tests:
          - not_null

  - name: stg_order_payments_olist
    description: "Staging table for order payment methods, installment splits, and total payment amounts."
    columns:
      - name: order_id
        description: "The unique identifier of the order."
        tests:
          - not_null
      - name: payment_sequence_number
        description: "The sequential order of payment methods if multiple methods were used."
        tests:
          - not_null
      - name: payment_type
        description: "The method of payment (e.g., credit_card, boleto, voucher, debit_card)."
        tests:
          - not_null
      - name: payment_installments
        description: "The number of installments chosen for the payment."
      - name: payment_value
        description: "The total monetary value processed by this payment method."

  - name: stg_order_reviews_olist
    description: "Staging table for customer review feedback, scores, and response timestamps."
    columns:
      - name: review_id
        description: "The unique identifier of the review."
        tests:
          - not_null
      - name: order_id
        description: "The unique identifier of the order being reviewed."
        tests:
          - not_null
      - name: review_score
        description: "The satisfaction score ranging from 1 to 5."
        tests:
          - not_null
      - name: created_at
        description: "The timestamp when the review survey was sent to the customer."
      - name: answered_at
        description: "The timestamp when the customer submitted their response."

  - name: stg_orders_olist
    description: "Staging table for core order records, capturing fulfillment status and key operational timestamps."
    columns:
      - name: order_id
        description: "The unique identifier of the order."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "The unique identifier linking the order to a specific customer record."
        tests:
          - not_null
      - name: order_status
        description: "The current lifecycle status of the order (e.g., delivered, shipped, canceled)."
        tests:
          - not_null