version: 2

sources:
  - name: silver_customers
    database: silver_dev
    schema: customers
    tables:
      - name: silver_customers_base_metrics

models:
  - name: int_customer_base_metrics
    description: "Intermediate customer metrics enriched with calculated KPIs from silver layer."
    columns:
      - name: customerid
        description: "Unique customer identifier"
        tests:
          - not_null
          - unique
      - name: avg_order_value
        description: "Average order value per customer"
      - name: days_since_last_purchase
        description: "Number of days since last purchase"
      - name: revenue_per_day
        description: "Average daily revenue per customer"

  - name: int_user_activity
    description: "Aggregated daily, weekly, and monthly active users"
    columns:
      - name: event_date
        description: "Date of events"
        tests:
          - not_null
      - name: dau
        description: "Daily Active Users"
      - name: wau
        description: "Weekly Active Users"
      - name: mau
        description: "Monthly Active Users"

  - name: int_campaign_cvr
    description: "Intermediate model calculating conversion rate (CVR) by campaign."
    columns:
      - name: campaign_id
        description: "Marketing campaign identifier."
      - name: total_engagements
        description: "Total number of engagement events (clicks, opens, etc.)."
      - name: total_conversions
        description: "Total number of distinct orders per campaign."
      - name: cvr
        description: "Conversion rate = total_conversions / total_engagements."

  - name: int_aov_overall
    description: "Intermediate table calculating Average Order Value (AOV) by currency"
    columns:
      - name: currency_code
        description: "Currency of the orders"
        tests:
          - not_null
      - name: total_orders
        description: "Total number of orders in the period"
        tests:
          - not_null
      - name: total_revenue
        description: "Total revenue generated in the period"
        tests:
          - not_null
      - name: aov
        description: "Average Order Value: total_revenue / total_orders"
        tests:
          - not_null

  - name: int_aov_by_campaign
    description: "Average Order Value (AOV) per campaign, calculated from customer orders linked to campaigns via journey events."
    columns:
      - name: campaign_id
        description: "Campaign identifier from journey events"
        tests:
          - not_null
          - unique
      - name: total_orders
        description: "Total number of distinct orders linked to the campaign"
      - name: total_revenue
        description: "Sum of total_amount from orders linked to the campaign"
      - name: aov
        description: "Average Order Value for the campaign (total_revenue / total_orders)"

  - name: int_campaign_roas
    description: "ROAS per campaign using revenue from orders and marketing spend"
    columns:
      - name: campaign_id
        description: "Unique campaign identifier"
        tests:
          - not_null
          - unique
      - name: total_revenue
        description: "Total revenue generated by the campaign"
      - name: total_spend
        description: "Total marketing spend for the campaign"
      - name: roas
        description: "Return on Ad Spend (Revenue / Spend)"

  - name: int_funnel_events
    description: "Unified funnel event log across awareness, consideration, and conversion stages."
    columns:
      - name: customer_id
        tests:
          - not_null
      - name: campaign_id
        description: "Marketing campaign attributed to the event or conversion."
      - name: channel
        description: "Marketing channel of the campaign."
      - name: funnel_stage
        description: "Stage in the customer journey funnel."
      - name: stage_ts
        description: "Timestamp of the funnel event."

  - name: int_funnel_events_by_campaign
    description: |
      Intermediate table that aggregates funnel engagement and conversion
      counts by campaign and funnel stage. Built from `int_funnel_events`
      to support conversion rate and drop-off analysis at the campaign level.
    columns:
      - name: campaign_id
        description: "Unique identifier for each marketing campaign."
        tests:
          - not_null
      - name: funnel_stage
        description: |
          Funnel stage classification:
          - awareness: email_open, push_open
          - consideration: email_click, sms_click
          - conversion: order
        tests:
          - not_null
          - accepted_values:
              values: ['awareness', 'consideration', 'conversion']
      - name: user_count
        description: "Number of distinct customers who reached the given funnel stage for the campaign."
        tests:
          - not_null

  - name: int_funnel_events_by_channel
    description: |
      Intermediate table that aggregates funnel events and conversions 
      by marketing channel. It combines event-level engagement data 
      from `int_funnel_events` with channel attributes from `stg_dim_campaign`.
      This model is used to calculate funnel metrics such as 
      awareness, consideration, and conversion per channel.

    columns:
      - name: channel
        description: "Marketing channel (e.g., Email, SMS, Push, Social, etc.)"
        tests:
          - not_null

      - name: funnel_stage
        description: "Stage in the marketing funnel (e.g., awareness, consideration, conversion)."
        tests:
          - not_null

      - name: total_users
        description: "Number of distinct users who reached this funnel stage within the channel."
        tests:
          - not_null

      - name: total_events
        description: "Total count of funnel-related events that occurred for this channel and stage."

      - name: first_event_ts
        description: "Earliest timestamp of an event for this channel and stage."

      - name: last_event_ts
        description: "Latest timestamp of an event for this channel and stage."

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['channel', 'funnel_stage']

  - name: int_funnel_conversion_by_channel
    description: "Pivoted funnel metrics per marketing channel with conversion rates."
    columns:
      - name: channel
        description: "Marketing channel (e.g., email, push, SMS)."
        tests:
          - not_null
      - name: awareness_users
        description: "Distinct users in awareness stage."
      - name: consideration_users
        description: "Distinct users in consideration stage."
      - name: conversion_users
        description: "Distinct users in conversion stage."
      - name: rate_awareness_to_consideration
        description: "Conversion rate from awareness to consideration."
      - name: rate_consideration_to_conversion
        description: "Conversion rate from consideration to conversion."
      - name: rate_overall_conversion
        description: "Overall conversion rate from awareness to conversion."

  - name: int_funnel_conversion_by_campaign
    description: "Pivoted funnel metrics per campaign with conversion rates."
    columns:
      - name: campaign_id
        description: "Campaign identifier."
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_campaign')
              field: campaign_id
      - name: channel
        description: "Marketing channel for the campaign."
      - name: objective
        description: "Campaign objective."
      - name: budget
        description: "Campaign budget."
      - name: start_dt
        description: "Campaign start date."
      - name: end_dt
        description: "Campaign end date."
      - name: awareness_users
        description: "Distinct users in awareness stage."
      - name: consideration_users
        description: "Distinct users in consideration stage."
      - name: conversion_users
        description: "Distinct users in conversion stage."
      - name: rate_awareness_to_consideration
        description: "Conversion rate from awareness to consideration."
      - name: rate_consideration_to_conversion
        description: "Conversion rate from consideration to conversion."
      - name: rate_overall_conversion
        description: "Conversion rate from awareness to conversion."

  - name: int_customer_cohort_monthly
    description: |
      Monthly customer cohort table. Defines each customer’s first purchase
      and assigns them to a monthly cohort for LTV, CAC, and retention analysis.
    columns:
      - name: customerid
        description: Unique identifier for each customer.
        tests:
          - not_null
          - unique

      - name: first_order_date
        description: Date of the customer’s first purchase, from customers_base_metrics.
        tests:
          - not_null

      - name: cohort_month
        description: The month of the customer’s first purchase. Used to group customers into monthly cohorts.
        tests:
          - not_null

  - name: int_customer_revenue_monthly
    description: |
      Customer revenue table aggregated by customer.
      Computes total orders, total revenue (LTV), and the most recent order date.
      Source table is int_customers_orders.
    columns:
      - name: customer_id
        description: Unique identifier for each customer.
        tests:
          - not_null
          - unique

      - name: total_orders
        description: Total number of orders placed by the customer.
        tests:
          - not_null

      - name: total_revenue
        description: Sum of all order amounts for the customer (used for LTV calculations).
        tests:
          - not_null

      - name: last_order_date
        description: Date of the most recent order for the customer.
        tests:
          - not_null

  - name: int_customer_product
    description: |
      Customer-level product table.
      Captures each customer's favorite product and total number of distinct products purchased.
      This table is independent of cohort/month; monthly granularity can be added by joining with the customer cohort table.
    columns:
      - name: customer_id
        description: Unique identifier for each customer.
        tests:
          - not_null
          - unique

      - name: favorite_product_id
        description: Product ID of the customer's most purchased product.
        tests:
          - not_null

      - name: favorite_product_description
        description: Description of the customer's most purchased product.
        tests:
          - not_null

      - name: total_products_purchased
        description: Count of distinct products purchased by the customer.
        tests:
          - not_null

  - name: int_customer_marketing
    description: |
      Customer-level marketing table.
      Captures each customer's first-touch campaign and assigns acquisition cost based on the campaign spend on the day of first interaction.
      Uses window functions to guarantee the true first-touch per customer.
      This table is customer-level; monthly cohort aggregation can be applied later.
    columns:
      - name: customer_id
        description: Unique identifier for each customer.
        tests:
          - not_null
          - unique

      - name: first_campaign_id
        description: ID of the first marketing campaign the customer interacted with.
        tests:
          - not_null

      - name: channel_first_touch
        description: Marketing channel of the first-touch campaign (e.g., email, social, ad).
        tests:
          - not_null

      - name: first_event_date
        description: Timestamp

  - name: int_customer_funnel
    description: "Customer-level funnel summary with first timestamps for each stage, conversion flag, and days_to_convert"
    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        tests:
          - not_null
          - unique
      - name: campaign_id
        description: "Marketing campaign associated with the funnel events"
        tests:
          - not_null
      - name: channel
        description: "Marketing channel (email, push, sms, etc.)"
      - name: first_awareness_ts
        description: "Timestamp of the customer's first awareness stage event"
      - name: first_consideration_ts
        description: "Timestamp of the customer's first consideration stage event"
      - name: first_conversion_ts
        description: "Timestamp of the customer's first conversion stage event (final purchase)"
      - name: is_converted
        description: "Flag indicating whether the customer reached the conversion stage"
      - name: days_to_convert
        description: "Number of days between first awareness and conversion stage (null if not converted)"

  - name: int_customer_value_segments
    description: "Customer-level value segmentation using int_customer_base_metrics with RFM scoring and value labels"
    columns:
      - name: customerid
        description: "Unique identifier for each customer"
        tests:
          - not_null
          - unique
      - name: country
        description: "Customer country or region"
      - name: orders
        description: "Total number of orders placed by the customer"
      - name: gross_revenue
        description: "Total revenue generated by the customer"
      - name: last_purchase
        description: "Date of the customer's most recent purchase"
      - name: recency_days
        description: "Number of days since the customer's last purchase"
      - name: recency_score
        description: "Recency score (higher = more recent)"
      - name: frequency_score
        description: "Frequency score (higher = more orders)"
      - name: monetary_score
        description: "Monetary score (higher = more total revenue)"
      - name: rfm_total_score
        description: "Sum of recency, frequency, and monetary scores"
      - name: value_segment
        description: "Customer value segment label: High Value, Medium Value, Low Value"

  - name: int_cohort_metrics
    description: "Cohort-level metrics including customer counts, conversion rate, and revenue aggregated by acquisition month"
    columns:
      - name: cohort_month
        description: "Month of customer acquisition based on first purchase"
        tests:
          - not_null
      - name: customers_in_cohort
        description: "Number of customers in the cohort"
        tests:
          - not_null
      - name: converted_customers
        description: "Number of customers in the cohort who reached the conversion stage"
      - name: conversion_rate
        description: "Proportion of converted customers in the cohort (converted / total)"
      - name: total_revenue
        description: "Total revenue generated by customers in the cohort"
      - name: avg_revenue_per_customer
        description: "Average revenue per customer in the cohort (total_revenue / customers_in_cohort)"

  - name: int_campaign_cohorts
    description: "Aggregated cohort-level metrics by campaign based on first_conversion_ts from int_customer_funnel."

  - name: campaign_id
    description: "Unique identifier for the marketing campaign that acquired the customer."
    tests:
      - not_null
      - unique
  - name: cohort_month
    description: "Month of first conversion; defines the cohort for each customer."
    tests:
      - not_null
  - name: customer_count
    description: "Number of customers in the cohort who converted."
    tests:
      - not_null
  - name: conversions
    description: "Total number of conversions in the cohort (should equal customer_count in this filtered table)."
    tests:
      - not_null
  - name: avg_days_to_convert
    description: "Average number of days it took customers in this cohort to convert, from first awareness to conversion."
    tests:
      - not_null

  - name: int_daily_conversions
    description: "Daily-level metrics including total orders, total revenue, and total customer conversions."
    columns:
      - name: date
        description: "Date of aggregation (from order_date / first_conversion_ts)."
        tests:
          - not_null
          - unique
      - name: total_orders
        description: "Total number of orders placed on this date."
        tests:
          - not_null
          - expression_is_true:
              expression: "total_orders >= 0"
      - name: total_conversions
        description: "Total number of unique customers who converted on this date (from funnel table)."
        tests:
          - not_null
          - expression_is_true:
              expression: "total_conversions >= 0"
      - name: total_revenue
        description: "Total revenue from all orders on this date (sum of total_amount)."
        tests:
          - not_null

  - name: int_daily_marketing_metrics
    description: "Daily aggregated marketing metrics including total spend and total impressions."
    columns:
      - name: date
        description: "Date of marketing activity."
        tests:
          - not_null
          - unique
      - name: total_spend
        description: "Total marketing spend on this date (sum across all campaigns)."
        tests:
          - not_null
          - expression_is_true:
              expression: "total_spend >= 0"
      - name: total_impressions
        description: "Total number of ad impressions on this date (sum across all campaigns)."
        tests:
          - not_null
          - expression_is_true:
              expression: "total_impressions >= 0"

models:

  - name: int_daily_kpis
    description: "Daily-level KPIs combining user activity, customer conversions, and marketing metrics."
    columns:
      - name: date
        description: "Date of aggregation."
        tests:
          - not_null
          - unique
      - name: dau
        description: "Daily Active Users."
        tests:
          - not_null
          
      - name: wau
        description: "Weekly Active Users (7-day rolling)."
        tests:
          - not_null
          
      - name: mau
        description: "Monthly Active Users (30-day rolling)."
        tests:
          - not_null
         
      - name: total_orders
        description: "Total number of orders on this date."
        tests:
          - not_null
          
      - name: total_conversions
        description: "Total number of unique customers who converted on this date."
        tests:
          - not_null
         
      - name: total_revenue
        description: "Total revenue from all orders on this date."
        tests:
          - not_null
         
      - name: total_spend
        description: "Total marketing spend on this date."




         

  
